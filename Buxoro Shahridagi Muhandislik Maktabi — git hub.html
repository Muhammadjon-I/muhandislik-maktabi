<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<style>artifact-sync,artifact-local{display:contents}
.hero{position:relative}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--border-light) 1px,transparent 1px),linear-gradient(90deg,var(--border-light) 1px,transparent 1px);background-size:36px 36px;opacity:.35;pointer-events:none;mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%)}
.gear{position:absolute;color:var(--accent);opacity:.22;pointer-events:none;animation:spin 40s linear infinite}
.gear svg{width:100%;height:100%;display:block}
.gear.g1{width:150px;height:150px;top:10px;right:-10px}
.gear.g2{width:70px;height:70px;top:48px;right:215px;color:var(--primary);animation-direction:reverse;animation-duration:26s}
.gear.g3{width:70px;height:70px;bottom:-14px;left:46%;color:var(--primary);opacity:.15}
.mascot{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;pointer-events:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.mascot .arm{transform-origin:62px 53px;animation:wave 1.1s ease-in-out infinite}
body.edit-on .mascot{display:none}
.sec-tag::before{content:"⚙️ "}
#dastur .sec-tag::before{content:"🤖 "}#yangiliklar .sec-tag::before{content:"📡 "}#sertifikat .sec-tag::before{content:"🏅 "}#ustozlar .sec-tag::before{content:"🧠 "}#hamkorlar .sec-tag::before{content:"🔧 "}#faq .sec-tag::before{content:"💡 "}#aloqa .sec-tag::before{content:"🛰️ "}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wave{50%{transform:rotate(-28deg)}}
@media (max-width:640px){.gear.g1{width:100px;height:100px}.gear.g2{display:none}.mascot svg{width:46px;height:58px}}
@media (prefers-reduced-motion:reduce){.gear,.mascot,.mascot .arm{animation:none}}

<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Buxoro Shahridagi Muhandislik Maktabi — Rasmiy Portal</title>
<style>
        :root{--bg-main:#f6f4ee;--bg-card:#ffffff;--bg-input:var(--bg-input);--bg-dark:#0b1d44;--primary:#12307a;--primary-hover:#0c2260;--accent:#b8892e;--text-dark:#18202f;--text-muted:#505b70;--border-light:#e2dfd7;--tint:#e8edf8;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg-main:#0e1526;--bg-card:#16203a;--bg-input:#101a33;--bg-dark:#060d1f;--primary:#3b63c9;--primary-hover:#2f52ad;--accent:#e3b95c;--text-dark:#e7ebf5;--text-muted:#a3aec6;--border-light:#27345a;--tint:#1b2a52}}
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-main); color: var(--text-dark); line-height: 1.65; }

        /* Top Ticker */
        .ticker { background: var(--bg-dark); color: #e2e8f0; font-size: 0.85rem; padding: 10px 20px; text-align: center; border-bottom: 2px solid var(--accent); }
        .ticker strong { color: #fbbf24; }

        /* Navigation */
        nav { background: color-mix(in srgb, var(--bg-main) 92%, transparent); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-light); }
        .nav-inner { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo span { background: var(--primary); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
        .nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.95rem; transition: 0.2s; }
        .nav-links a:hover { color: var(--primary); }
        .nav-cta { background: var(--primary); color: white; padding: 9px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .nav-cta:hover { background: var(--primary-hover); }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Hero Split */
        .hero { padding: 64px 0 48px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; }
        .badge { display: inline-block; background: var(--tint); color: var(--primary); padding: 6px 14px; border-radius: 99px; font-weight: 700; font-size: 0.82rem; margin-bottom: 18px; border: 1px solid var(--border-light); }
        .hero h1 { font-size: 2.7rem; line-height: 1.18; color: var(--bg-dark); margin-bottom: 20px; letter-spacing: -0.02em; }
        .hero p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 28px; }
        .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn-primary { background: var(--primary); color: white; padding: 14px 26px; border-radius: 10px; text-decoration: none; font-weight: 700; transition: 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--bg-card); color: var(--text-dark); padding: 14px 26px; border-radius: 10px; text-decoration: none; font-weight: 700; border: 1px solid var(--border-light); transition: 0.2s; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        .hero-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .stat-box { background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
        .stat-box .num { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1.1; margin-bottom: 6px; }
        .stat-box .lbl { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        /* Sections */
        section { padding: 56px 0; border-top: 1px solid var(--border-light); }
        .sec-head { max-width: 720px; margin-bottom: 36px; }
        .sec-tag { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; display: block; }
        .sec-head h2 { font-size: 2rem; color: var(--bg-dark); margin-bottom: 10px; }
        .sec-head p { color: var(--text-muted); font-size: 1.02rem; }

        /* Grid Cards */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
        .card { background: var(--bg-card); padding: 28px; border-radius: 16px; border: 1px solid var(--border-light); transition: 0.2s; }
        .card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .card h3 { font-size: 1.2rem; color: var(--bg-dark); margin-bottom: 10px; }
        .card p { color: var(--text-muted); font-size: 0.96rem; }

        /* University Grant Highlight */
        .grant-banner { background: var(--bg-dark); color: white; border-radius: 20px; padding: 36px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; align-items: center; margin-top: 28px; }
        .grant-banner h3 { font-size: 1.55rem; margin-bottom: 12px; color: #fbbf24; }
        .grant-banner p { color: #dbe4fa; font-size: 0.98rem; }
        .grant-steps { background: rgba(255,255,255,0.07); padding: 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); }
        .grant-steps li { margin-left: 18px; margin-bottom: 8px; font-size: 0.92rem; color: #f1f5f9; }

        /* Admission Interactive Tabs & Documents */
        .admission-wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; }
        .tab-btns { display: flex; gap: 10px; margin-bottom: 18px; }
        .tab-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-light); background: var(--bg-card); font-weight: 700; cursor: pointer; color: var(--text-dark); transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .exam-panel { background: var(--bg-card); padding: 28px; border-radius: 16px; border: 1px solid var(--border-light); }
        .exam-list { list-style: none; margin-top: 16px; }
        .exam-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-light); font-weight: 600; }
        .exam-list li:last-child { border-bottom: none; }
        .exam-list span.count { background: #fef3c7; color: #b45309; padding: 3px 10px; border-radius: 6px; font-size: 0.88rem; }

        .docs-box { background: var(--bg-card); padding: 28px; border-radius: 16px; border: 1px solid var(--border-light); }
        .docs-box h3 { margin-bottom: 14px; font-size: 1.2rem; }
        .docs-box ul { margin-left: 20px; color: var(--text-muted); font-size: 0.95rem; }
        .docs-box li { margin-bottom: 10px; }
        .note-pill { margin-top: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 10px; font-size: 0.88rem; }

        /* News & Events */
        .news-tag { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--primary); background: var(--tint); padding: 3px 10px; border-radius: 6px; margin-bottom: 10px; }

        /* FAQ Accordion */
        details { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 12px; padding: 18px 22px; margin-bottom: 12px; }
        summary { font-weight: 700; cursor: pointer; color: var(--bg-dark); font-size: 1.02rem; }
        details p { margin-top: 12px; color: var(--text-muted); font-size: 0.95rem; }

        /* Registry & Contact */
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .info-card { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-light); }
        .info-row { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .info-label { font-size: 0.82rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px; }
        .info-val { font-size: 1.05rem; font-weight: 700; color: var(--bg-dark); }
        .info-val a { color: var(--primary); text-decoration: none; }

        form { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-light); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.95rem; background: var(--bg-input); }
        button[type="submit"] { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button[type="submit"]:hover { background: var(--primary-hover); }
        #formStatus { margin-top: 12px; font-weight: 600; color: var(--primary); display: none; }

        footer { background: var(--bg-dark); color: #94a3b8; padding: 36px 24px; text-align: center; font-size: 0.9rem; margin-top: 40px; }
        footer a { color: #e3b95c; text-decoration: none; }

        @media (max-width: 860px) {
            .hero, .grant-banner, .admission-wrap, .contact-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.1rem; }
        }

<!-- Curriculum & University Integration -->
<section id="dastur">
<div class="sec-head">
<span class="sec-tag" data-k="k27">Ta’lim modeli</span>
<h2 data-k="k28">5 yillik STEM dasturi va amaliy muhandislik</h2>
<p data-k="k29">Ta’lim jarayoni "Yangi Özbekiston" universiteti hamda Mirzo Uluğbek nomidagi ixtisoslaştirilgan maktab tajribasi asosida taşkil etilgan.</p>
</div>
<div class="grid-3">
<div class="card">
<h3 data-k="k30">Çuqurlaştirilgan STEM fanlari</h3>
<p data-k="k31">Algebra, geometriya, fizika, informatika va ingliz tili fanlari xalqaro standartlar asosida çuqur örgatiladi.</p>
</div>
<div class="card">
<h3 data-k="k32">Kelajak texnologiyalari</h3>
<p data-k="k33">Sun’iy intellekt (AI), kiberxavfsizlik, robototexnika, 3D-modellashtirish va startap asoslari böyiça amaliy maşğulotlar.</p>
</div>
<div class="card">
<h3 data-k="k34">Majburiy işlab çiqariş amaliyoti</h3>
<p data-k="k35">Yuqori sinf öquvçilari uçun zamonaviy sanoat korxonalari va texnoparklarda 2 oylik amaliyot dasturlari yölga qöyilgan.</p>
</div>
</div>
<div class="grant-banner">
<div>
<h3 data-k="k36">Buxoro davlat texnika universiteti bilan uzviy integratsiya</h3>
<p data-k="k37">Maktab sobiq Buxoro davlat texnika universiteti akademik litseyi negizida taşkil etilgan bölib, öquvçilar universitetning zamonaviy laboratoriyalari va innovatsion loyihalarida bevosita şuğullanadi.</p>
</div>
<div class="grant-steps">
<ul>
<li><strong data-k="k38">11-sinfda:</strong><span class="e" data-k="k39"> Oliygohning 1-kurs dasturlari bilan integratsiyalaşgan ta’lim.</span></li>
<li><strong data-k="k40">Bitirgaç:</strong><span class="e" data-k="k41"> Universitetning 2-kursidan davlat granti asosida öqişni davom ettiriş imtiyozi.</span></li>
<li><strong data-k="k42">Mentorlik:</strong><span class="e" data-k="k43"> Universitet professor-öqituvçilari va muhandislaridan bevosita saboq oliş.</span></li>
</ul>
</div>
</div>
</section>

</div>
<details>
<summary data-k="k90">Maktabda öqiş pullikmi yoki bepulmi?</summary>
<p data-k="k91">Buxoro şahridagi Muhandislik maktabi davlat ixtisoslaştirilgan ta’lim muassasasi bölib, barça öquvçilar davlat byudjeti mablağlari hisobidan mutlaqo bepul öqitiladi.</p>
</details>
<details>
<summary data-k="k92">Qaysi sinflardan boşlab hujjat topşiriş mumkin?</summary>
<p data-k="k93">Asosiy qabul 6-sinfni tamomlagan öquvçilar uçun 7-sinfga amalga oşiriladi. Şuningdek, ajratilgan kvotalar doirasida 8-, 9- va 10-sinflarga ham kiriş imtihonlari asosida öquvçilar qabul qilinadi.</p>
</details>
<details>
<summary data-k="k94">Maktab bitiruvçilari oliy ta’lim muassasalariga kirişda imtiyozga egami?</summary>
<p data-k="k95">Ha. PQ-278-son Prezident qaroriga muvofiq, dasturni muvaffaqiyatli tamomlagan öquvçilar uçun tegişli texnika oliygohida (jumladan, Buxoro davlat texnika universitetida) 2-kursdan davlat granti asosida ta’lim oliş imkoniyati yaratiladi.</p>
</details>

function imgSrc(id){return String(id).startsWith('data:')?id:'/_blob/'+id}
const toURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
async function inline(id){if(!id||String(id).startsWith('data:'))return id;const r=await fetch('/_blob/'+id);return toURL(await r.blob())}
async function saveFile(n,t){const d=window.claude?await claude.use('downloads'):null;
 if(d){await d.save({filename:n,data:t});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download=n;document.body.append(a);a.click();a.remove()}

 for(const k in d.lists)for(const it of d.lists[k])if(it.img)it.img=await inline(it.img);

function ghCfg(){try{return JSON.parse(localStorage.getItem('gh')||'{}')}catch(e){return {}}}

const b64=t=>{const u=new TextEncoder().encode(t);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function ghSave(){const c=ghCfg();
 if(!/^[\w.-]+\/[\w.-]+$/.test(c.r||'')||!c.t)throw new Error('Sozlamalarda GitHub repo va token kiriting');
 const br=c.b||'main',u='https://api.github.com/repos/'+c.r+'/contents/index.html',H={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};
 let sha;const g=await fetch(u+'?ref='+encodeURIComponent(br),{headers:H});
 if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('GitHub '+g.status+': repo, branch yoki token noto‘g‘ri');
 const doc=await exportDoc();
 const r=await fetch(u,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Sayt yangilandi',content:b64(doc),branch:br,...(sha?{sha}:{})})});
 if(!r.ok)throw new Error('GitHub '+r.status+' '+((await r.json().catch(()=>({}))).message||''))}
